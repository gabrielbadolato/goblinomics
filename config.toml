# Goblinomics: monitor da casa de leilões do WoW: Forever

regiao = "us"
idioma = "en_US"

# Rulesets: 1 = PvP, 2 = Normal, 3 = Roleplay, 15 = Roleplay PvP.
# Qualquer um devolve as 15 casas de todos os rulesets; cada ruleset tem três delas
# (Aliança, Horda, neutra). Pela ordem: 110/113/116 PvP, 111/114/117 Normal,
# 112/115/118 sem uso, 119/120/121 Roleplay, 123/124/125 Roleplay PvP (ver exportar.py).
# Em 10/11/2026 os quatro devolviam exatamente os mesmos anúncios (as casas são
# compartilhadas), então coletar um só já cobre todos.
rulesets = [2]

# Só coleta casas cujo nome contenha um destes textos. Lista vazia = todas
# (Aliança, Horda e a neutra, Blackwater).
filtro_casas = []

banco = "dados/ah.sqlite"
credenciais = "segredos/credenciais.env"

# Fotos brutas guardadas por casa, para reprocessar se a API mudar de formato.
pasta_brutos = "dados/brutos"
brutos_por_casa = 3

# Página de consulta: os JSON vão para <pasta_site>/dados a cada coleta.
pasta_site = "site"
# Horda do ruleset Normal. Quem usa a página pode marcar outra como padrão no próprio navegador.
casa_padrao = 114

# Publicação no GitHub Pages (ramo gh-pages). Vazio = não publica.
# Ex.: "git@github.com:usuario/repositorio.git"
repositorio_pages = "git@github.com:gabrielbadolato/goblinomics.git"
chave_pages = "segredos/pages_deploy_key"
pasta_pages = ".pages"

# Guildas mostradas na aba Profissões (quem fabrica o quê). O nome vai como no endereço da API:
# minúsculas, com hífen no lugar dos espaços. Relidas a cada 12 h.
guildas = ["rusty-joints"]
# Personagens fora dessas guildas, um por um, como "nome-sobrenome" em minúsculas.
# Aparecem no mesmo campo, no grupo "Outros personagens".
personagens = []
# true = nome e sobrenome do personagem; false = só o primeiro nome.
sobrenome_na_guilda = true

# Bot do Discord (python -m ahforever.botdiscord): /preco, /receita e /quemfaz.
# O token fica fora do git, sozinho no arquivo abaixo (permissão 600).
bot_token = "segredos/discord_bot_token"
# Números dos servidores do Discord onde os comandos aparecem na hora. Vazio = todo servidor
# que convidar o bot (o Discord pode levar até uma hora para mostrar os comandos).
bot_servidores = [1567628123250499684]   # Rusty Joints
url_site = "https://gabrielbadolato.github.io/goblinomics/"
# Hora (do relógio desta máquina) a partir da qual sai o resumo diário da guilda, no canal escolhido com /canalavisos.
bot_resumo_hora = 19

# Alertas no Discord: regras em alertas.toml; a URL do webhook fica fora do git.
alertas = "alertas.toml"
webhook_discord = "segredos/discord_webhook"
